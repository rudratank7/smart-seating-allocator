<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Seating Processor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  </head>
  <body class="bg-light d-flex align-items-center justify-content-center" style="height:100vh;">
    <div class="card p-4" style="width:640px;">
      <h4 class="text-center mb-3">Upload Excel files</h4>
      {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
      <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label">Class file:</label>
          <input class="form-control" type="file" name="class_file" required />
        </div>
        <div class="mb-3">
          <label class="form-label">Student file:</label>
          <input class="form-control" type="file" name="student_file" required />
        </div>
        <div class="mb-3">
          <label class="form-label">Enter Examination Type:</label>
          <input class="form-control" type="text" name="user_data" placeholder="e.g., Mid-term, Final" />
        </div>
        <button type="submit" class="btn btn-primary w-100">Process & Download</button>
      </form>
    </div>
  </body>
</html>
